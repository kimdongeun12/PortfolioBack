name: Deploy API to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/portfolio' }}
      UPLOAD_DIR: ${{ vars.UPLOAD_DIR || '/home/ubuntu/portfolio-release' }}
      APP_USER: ${{ vars.APP_USER || 'portfolio' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'portfolio' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://api.rloorn.com/api/projects' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      EC2_SG_ID: ${{ vars.EC2_SG_ID }}
      HAS_AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST secret is not set. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'

      - uses: actions/setup-java@v4
        if: steps.settings.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.settings.outputs.ready == 'true'

      - name: Build jar
        if: steps.settings.outputs.ready == 'true'
        run: |
          ./gradlew bootJar --no-daemon
          cp "$(ls build/libs/*.jar | grep -v plain | head -n 1)" app.jar

      - name: Configure AWS credentials
        if: steps.settings.outputs.ready == 'true' && env.HAS_AWS_KEY == 'true' && env.EC2_SG_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Open SSH for this runner
        id: sg
        if: steps.settings.outputs.ready == 'true' && env.HAS_AWS_KEY == 'true' && env.EC2_SG_ID != ''
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          aws ec2 authorize-security-group-ingress --group-id "$EC2_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-deploy}]"
          echo "ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        if: steps.settings.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app.jar
          target: ${{ env.UPLOAD_DIR }}

      - name: Restart service
        if: steps.settings.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          UPLOAD_DIR: ${{ env.UPLOAD_DIR }}
          APP_USER: ${{ env.APP_USER }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,UPLOAD_DIR,APP_USER,SERVICE_NAME
          script: |
            set -e
            if sudo test -f "$APP_DIR/app.jar"; then
              sudo cp -p "$APP_DIR/app.jar" "$APP_DIR/app.jar.bak"
            fi
            sudo install -o "$APP_USER" -g "$APP_USER" -m 0644 "$UPLOAD_DIR/app.jar" "$APP_DIR/app.jar"
            rm -f "$UPLOAD_DIR/app.jar"
            sudo systemctl restart "$SERVICE_NAME"
            sleep 5
            sudo systemctl is-active "$SERVICE_NAME"
            sudo stat -c 'deployed %y' "$APP_DIR/app.jar"

      - name: Close SSH for this runner
        if: always() && steps.sg.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$EC2_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.sg.outputs.ip }}/32}]"

      - name: Health check
        if: steps.settings.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$HEALTH_URL"; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not respond in time: $HEALTH_URL"
          exit 1
