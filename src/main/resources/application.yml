# 공통 설정 (GitHub에 공개됨 — 비밀값을 직접 쓰지 마세요)
server:
  port: 8080

spring:
  profiles:
    # 기본은 local. 배포 서버에서는 환경변수 SPRING_PROFILES_ACTIVE=prod 로 실행
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
